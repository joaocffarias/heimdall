version: "3.9"

networks:
  heimdall_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  evolution_data:

services:
  # ─── Banco de dados ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: heimdall_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - heimdall_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache e Filas ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: heimdall_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - heimdall_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Object Storage (fotos) ───────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: heimdall_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - heimdall_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── WhatsApp (Evolution API) ─────────────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    container_name: heimdall_evolution
    restart: unless-stopped
    environment:
      SERVER_URL: ${EVOLUTION_API_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=evolution
      REDIS_ENABLED: "true"
      REDIS_URI: redis://redis:6379
      REDIS_PREFIX_KEY: evolution
      TZ: America/Sao_Paulo
    volumes:
      - evolution_data:/evolution/instances
    ports:
      - "8080:8080"
    networks:
      - heimdall_net
    depends_on:
      redis:
        condition: service_healthy

  # ─── API Backend (NestJS) ─────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: heimdall_api
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "4000:4000"
    networks:
      - heimdall_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Frontend (Next.js) ───────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: heimdall_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://192.168.18.223/api
      NEXT_PUBLIC_WS_URL: wss://192.168.18.223
      TZ: America/Sao_Paulo
    ports:
      - "3000:3000"
    networks:
      - heimdall_net
    depends_on:
      api:
        condition: service_healthy

  # ─── Proxy Reverso (Nginx) ────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: heimdall_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - heimdall_net
    depends_on:
      - web
      - api
